<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>NUA: The Roguelike (working title)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; padding: 0; background: #0c0c10; height: 100%; overflow: hidden; }
    canvas { touch-action: none; }
  </style>
</head>
<body>
  <!-- TESTING ONLY. Add ?headless to the URL to keep the game loop
       running while the page is hidden, so Claude can play and
       screenshot the game off-screen.

       Two things have to be faked, not one: browsers stop
       requestAnimationFrame for hidden tabs, AND Kaboom skips the
       body of every frame unless document.visibilityState is
       "visible". Patching only the first gives you a black screen.

       Without ?headless nothing here runs, so real players still get
       the normal behaviour of the game pausing in a background tab. -->
  <script>
    if (location.search.includes("headless")) {
      Object.defineProperty(document, "visibilityState", { get: () => "visible", configurable: true });
      Object.defineProperty(document, "hidden", { get: () => false, configurable: true });
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
    }
  </script>

  <!-- Engine: Kaboom.js, pinned version, loaded from CDN (needs internet) -->
  <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>

  <!-- Boot: starts the engine, sets up shared game state -->
  <script src="core/boot.js"></script>
  <script src="core/sfx.js"></script>
  <script src="core/save.js"></script>

  <!-- Data: characters, chapters, maps. Edit these to change the game's content. -->
  <script src="core/sprites-real.js"></script>
  <script src="core/plates-real.js"></script>
  <script src="data/characters.js"></script>
  <script src="data/level-gonzos.js"></script>
  <script src="data/chapters.js"></script>

  <!-- Core systems -->
  <script src="core/art.js"></script>
  <script src="core/player.js"></script>
  <script src="core/enemies.js"></script>
  <script src="core/companions.js"></script>
  <script src="core/ui.js"></script>

  <!-- Scenes -->
  <script src="scenes/title.js"></script>
  <script src="scenes/select.js"></script>
  <script src="scenes/tutorial.js"></script>
  <script src="scenes/area.js"></script>
  <script src="scenes/ending.js"></script>

  <!-- Go -->
  <script src="game.js"></script>
</body>
</html>
