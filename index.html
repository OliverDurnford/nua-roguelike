  <title>Now That's What I Call 10 Years</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- On a phone's home screen: "10 YEARS" big over the cover's sunburst
       (the whole title was too small to read there), and the album's name
       under it (Ollie, 13 and 15 Oct 2026). Rebuild icon/ with tools/icon/build_icon.py; bump ?v= so a phone
       fetches the new one. -->
  <meta name="apple-mobile-web-app-title" content="Now That's What I Call 10 Years">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- black-translucent: the page runs under the status bar instead of
       below it. With "black" an iPhone keeps a strip at the top for the
       status bar, and opened upright then turned (the loader waits for the
       turn) it sometimes kept that strip as a black bar until the game was
       reopened (Ollie, 15 Oct 2026). The page's own near-black shows there. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c10">
  <link rel="apple-touch-icon" href="icon/icon-180.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png?v=3">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; padding: 0; background: #0c0c10; height: 100%; overflow: hidden; }
    /* The page is pinned to the screen by the browser itself, so it takes a
       turned phone's new shape in the same instant as the phone does. Sizing
       it from code lagged a turn behind on an iPhone (core/turn.js). */
    body { position: fixed; inset: 0; overscroll-behavior: none; }
    canvas { touch-action: none; }

    /* The loading screen and the turn-your-phone card (core/loader.js,
       core/turn.js). Plain page elements, so they show before the engine
       or anything else has arrived. The kit's silver and blue on the
       page's own near-black. */
    #boot, #turn {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      background: #0c0c10; color: #e7ecff;
      font-family: "NUA Pixel", monospace; font-size: 16px; line-height: 24px; text-align: center;
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    #boot { z-index: 20; transition: opacity 0.3s; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot-label, #turn-label { visibility: hidden; }
    .fonts-ready #boot-label, .fonts-ready #turn-label { visibility: visible; }
    #boot-bar {
      width: 288px; max-width: 70vw; height: 12px; padding: 2px;
      border: 2px solid #b9c4e8; background: #1b1636;
    }
    #boot-fill {
      width: 0; height: 100%;
      /* blocks with a pixel between them, like the boss's health bar */
      background: repeating-linear-gradient(90deg, #8a97c9 0 8px, transparent 8px 9px);
    }
    #turn { z-index: 30; display: none; }
    /* The cover over a turn. While an iPhone turns it freezes the page and
       spins a picture of the old screen, then swaps in the new one, which
       anything run from code only sees afterwards (three attempts that way
       still popped, Ollie, 13 Oct 2026). So the cover is pure CSS: each
       way round has its own fade, and a new name restarts the animation,
       so the browser itself draws the cover in the very first frame of the
       new shape and fades it once the game has redrawn underneath. */
    #settle {
      position: fixed; inset: 0; z-index: 40; pointer-events: none;
      background: #0c0c10; opacity: 0;
    }
    @media (orientation: landscape) and (pointer: coarse) { #settle { animation: settle-wide 0.75s ease-in forwards; } }
    @media (orientation: portrait) and (pointer: coarse) { #settle { animation: settle-tall 0.75s ease-in forwards; } }
    @keyframes settle-wide { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes settle-tall { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
    #turn-phone {
      width: 30px; height: 52px; border: 4px solid #e7ecff; border-radius: 6px;
      box-shadow: inset 0 -6px 0 -2px #8a97c9;
      animation: turn-phone 2.4s ease-in-out infinite;
    }
    @keyframes turn-phone {
      0%, 25% { transform: rotate(0deg); }
      50%, 85% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <!-- TESTING ONLY. Add ?headless to the URL to keep the game loop
       running while the page is hidden, so Claude can play and
       screenshot the game off-screen.

       Two things have to be faked, not one: browsers stop
       requestAnimationFrame for hidden tabs, AND Kaboom skips the
       body of every frame unless document.visibilityState is
       "visible". Patching only the first gives you a black screen.

       Without ?headless nothing here runs, so real players still get
       the normal behaviour of the game pausing in a background tab.

       The frame pump ticks from a Web Worker, not setTimeout: hidden
       tabs throttle main-thread timers to about once a second, which
       put the whole game into slow motion mid-test. Worker timers are
       not throttled, so the loop holds 60fps off-screen. -->
  <script>
    if (location.search.includes("headless")) {
      Object.defineProperty(document, "visibilityState", { get: () => "visible", configurable: true });
      Object.defineProperty(document, "hidden", { get: () => false, configurable: true });
      const tick = new Worker(URL.createObjectURL(
        new Blob(["setInterval(() => postMessage(0), 16)"], { type: "text/javascript" })
      ));
      let frameCbs = [];
      tick.onmessage = () => {
        const cbs = frameCbs;
        frameCbs = [];
        for (const cb of cbs) cb(performance.now());
      };
      window.requestAnimationFrame = (cb) => (frameCbs.push(cb), 0);
    }
  </script>

  <div id="boot">
    <div id="boot-label">LOADING</div>
    <div id="boot-bar"><div id="boot-fill"></div></div>
  </div>
  <div id="turn">
