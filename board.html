<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Who's Winning</title>
  <!-- Who's Winning (21 Oct 2026): a live sports day board for everyone
       playing with a save word. Not part of the game: it only reads the
       save worker's GET /v1/board and links nothing of the game but its
       icon. Design: docs/superpowers/specs/2026-10-21-leaderboard-design.md -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c10">
  <meta name="robots" content="noindex">
  <link rel="apple-touch-icon" href="icon/icon-180.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png?v=5">
  <link rel="preload" href="board/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="board/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="board/board.css">
</head>
<body>
  <main class="board" id="board" data-state="loading">
    <header class="head">
      <h1 class="chrome">WHO'S WINNING</h1>
      <div class="sub">
        <span class="status"><span class="dot"></span><span id="state">LOADING</span></span>
        <span>FINISH LINE: PLATINUM</span>
      </div>
    </header>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="track" id="track">
      <div class="rows" id="rows" aria-hidden="true"></div>
      <div class="finish" aria-hidden="true"></div>
      <div class="lanes" id="lanes"></div>
    </div>
    <p class="note" id="note" hidden></p>
  </main>
  <script src="board/board-logic.js"></script>
  <script src="board/board.js"></script>
</body>
</html>
